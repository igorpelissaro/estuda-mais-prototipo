<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estuda+ – Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ===== Tokens do guia de estilo ===== */
  :root {
    --primaria: #1D4ED8; --primaria-escura: #1E3A8A; --primaria-clara: #EFF6FF;
    --texto: #1F2937; --texto-secundario: #4B5563;
    --borda-campo: #64748B; --borda: #E2E8F0;
    --fundo: #F8FAFC; --superficie: #FFFFFF; --neutro-hover: #F1F5F9;
    --alta-t: #9A3412; --alta-f: #FFEDD5;
    --media-t: #854D0E; --media-f: #FEF9C3;
    --baixa-t: #1E40AF; --baixa-f: #DBEAFE;
    --ok-t: #0F766E; --ok-f: #CCFBF1;
    --aviso-t: #92400E; --aviso-f: #FEF3C7;
    --erro-t: #B91C1C; --erro-f: #FEE2E2;
    --rapido: .15s;             /* transições curtas (até 200 ms) */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: 72px; scroll-padding-bottom: 96px; }   /* foco não fica escondido pelos elementos fixos */
  html.texto-grande { font-size: 112.5%; }                           /* preferência "Texto maior" */
  body { margin: 0; font-family: "Atkinson Hyperlegible", system-ui, sans-serif; font-size: 1rem; line-height: 1.5; color: var(--texto); background: #CBD5E1; }
  #app { max-width: 430px; margin: 0 auto; min-height: 100vh; background: var(--fundo); display: flex; flex-direction: column; }
  @media (min-width: 600px) { #app { box-shadow: 0 0 0 1px #94A3B8, 0 8px 32px rgba(0,0,0,.2); } }

  .ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }
  h1 { font-size: 1.75rem; margin: 0 0 8px; line-height: 1.25; letter-spacing: -0.01em; }
  h2 { font-size: 1.375rem; margin: 24px 0 8px; line-height: 1.3; } h3 { font-size: 1.125rem; margin: 0; line-height: 1.35; }
  p { margin: 0 0 8px; } .peq { font-size: .875rem; color: var(--texto-secundario); }
  ul.limpa, ol.limpa { list-style: none; padding: 0; margin: 0; }
  :focus-visible { outline: 3px solid var(--primaria-escura); outline-offset: 2px; }
  .pular { position: absolute; left: -999px; } .pular:focus { left: 16px; top: 8px; background: #fff; padding: 8px; z-index: 30; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ===== Cabeçalho, conteúdo e menu ===== */
  header { position: sticky; top: 0; z-index: 5; background: var(--primaria); color: #fff; padding: 6px 16px; min-height: 56px; display: flex; align-items: center; gap: 12px; }
  header .marca { font-size: 1.25rem; font-weight: 700; }
  header .acao-topo { color: #fff; font: inherit; font-weight: 700; background: none; border: 2px solid #fff; border-radius: 8px; min-height: 44px; padding: 0 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: background-color var(--rapido) ease-out; }
  header .acao-topo:hover { background: rgba(255,255,255,.15); }
  header .acao-topo:focus-visible { outline-color: #fff; }
  header .dir { margin-left: auto; }
  main { flex: 1; padding: 24px 16px 32px; }
  main.anim > * { animation: entrar var(--rapido) ease-out; }
  @keyframes entrar { from { opacity: 0; transform: translateY(6px); } }
  nav#menu { position: sticky; bottom: 0; z-index: 5; background: #fff; border-top: 1px solid var(--borda-campo); display: flex; }
  nav#menu a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 2px; color: var(--texto-secundario); text-decoration: none; font-size: .875rem; min-height: 60px; border-top: 4px solid transparent; transition: color var(--rapido) ease-out, background-color var(--rapido) ease-out; }
  nav#menu a:hover { color: var(--texto); background: var(--neutro-hover); }
  nav#menu a .ic { width: 24px; height: 24px; }
  nav#menu a[aria-current="page"] { color: var(--primaria); font-weight: 700; border-top-color: var(--primaria); text-decoration: underline; text-underline-offset: 3px; }

  /* ===== Cartões e etiquetas ===== */
  .card { background: var(--superficie); border: 1px solid var(--borda); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card.feita h3 { text-decoration: line-through; color: var(--texto-secundario); }
  .card.novo { border: 2px solid var(--primaria); }
  .acoes-cartao { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .acoes-cartao .separado { margin-left: auto; }        /* ação destrutiva afastada das demais */
  .tag { display: inline-flex; align-items: center; gap: 4px; min-height: 26px; font-size: .875rem; font-weight: 700; line-height: 1.2; padding: 2px 8px; border-radius: 6px; margin: 4px 4px 0 0; vertical-align: middle; }
  .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; } .tags .tag { margin: 0; }
  .tag.alta { color: var(--alta-t); background: var(--alta-f); }
  .tag.media { color: var(--media-t); background: var(--media-f); }
  .tag.baixa { color: var(--baixa-t); background: var(--baixa-f); }
  .tag.ok { color: var(--ok-t); background: var(--ok-f); }
  .tag.info { color: var(--primaria-escura); background: var(--baixa-f); }

  /* ===== Botões: primário, secundário, neutro, perigo e terciário (link) com estados ===== */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 20px; border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer; border: 2px solid var(--primaria); text-decoration: none; text-align: center;
         transition: background-color var(--rapido) ease-out, border-color var(--rapido) ease-out, transform .05s ease-out; }
  .btn:active { transform: translateY(1px); }
  .btn.prim { background: var(--primaria); color: #fff; } .btn.prim:hover { background: var(--primaria-escura); border-color: var(--primaria-escura); }
  .btn.sec { background: var(--primaria-clara); color: var(--primaria); } .btn.sec:hover { background: var(--baixa-f); }
  .btn.neutro { background: #fff; color: var(--texto); border-color: var(--borda-campo); } .btn.neutro:hover { background: var(--neutro-hover); }
  .btn.perigo { background: #fff; color: var(--erro-t); border-color: var(--erro-t); } .btn.perigo:hover { background: var(--erro-f); }
  .btn.perigo-forte { background: var(--erro-t); color: #fff; border-color: var(--erro-t); } .btn.perigo-forte:hover { background: #991B1B; border-color: #991B1B; }
  .btn.peq-btn { padding: 0 12px; font-size: .875rem; }
  .btn.bloco { width: 100%; }
  .link-btn { background: none; border: 0; padding: 0; min-height: 44px; font: inherit; font-weight: 700; color: var(--primaria); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-align: left; }
  .link-btn:hover { text-decoration-thickness: 2px; color: var(--primaria-escura); }
  .acoes { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }

  /* ===== Alertas e dicas ===== */
  .alerta { border-left: 4px solid; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  .alerta.aviso { color: var(--aviso-t); background: var(--aviso-f); }
  .alerta.erro { color: var(--erro-t); background: var(--erro-f); }
  .alerta.ok { color: var(--ok-t); background: var(--ok-f); }
  .alerta.info { color: var(--primaria-escura); background: var(--primaria-clara); }
  .alerta strong { display: flex; align-items: center; gap: 6px; } .alerta ul, .alerta ol { margin: 4px 0 0; padding-left: 20px; }
  .alerta .link-btn { color: inherit; min-height: 32px; }
  .alerta .acoes { margin-top: 12px; }

  /* ===== Formulários ===== */
  label, legend { display: block; font-weight: 700; margin-bottom: 4px; }
  .obrig { font-weight: 700; color: var(--erro-t); }
  .campo { margin-bottom: 20px; }
  input[type=text], input[type=date], select { width: 100%; min-height: 48px; padding: 8px 12px; font: inherit; border: 2px solid var(--borda-campo); border-radius: 8px; background: #fff; color: var(--texto); transition: border-color var(--rapido) ease-out; }
  input[type=text]:hover, input[type=date]:hover, select:hover { border-color: var(--texto); }
  [aria-invalid="true"] { border-color: var(--erro-t) !important; border-width: 3px !important; }
  .msg-erro { color: var(--erro-t); font-size: .875rem; font-weight: 700; margin-top: 4px; }
  .msg-erro:empty { display: none; }
  fieldset { border: 0; padding: 0; margin: 0 0 20px; min-width: 0; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .opcoes.coluna { flex-direction: column; }
  .opcoes label, label.check { display: flex; align-items: center; gap: 10px; font-weight: 400; border: 2px solid var(--borda-campo); border-radius: 8px; padding: 8px 12px; min-height: 48px; cursor: pointer; margin: 0; background: #fff; transition: background-color var(--rapido) ease-out; }
  .opcoes label:hover, label.check:hover { background: var(--neutro-hover); }
  .opcoes input, label.check input { width: 22px; height: 22px; accent-color: var(--primaria); flex: none; }
  .opcoes label:has(input:checked), label.check:has(input:checked) { border-color: var(--primaria); border-width: 3px; font-weight: 700; }
  .opcoes label:has(input:focus-visible), label.check:has(input:focus-visible) { outline: 3px solid var(--primaria-escura); outline-offset: 2px; }
  /* prioridade: três opções lado a lado; o rádio fica oculto visualmente, mas continua acessível */
  .opcoes.lado { flex-wrap: nowrap; }
  .opcoes.lado label { flex: 1; justify-content: center; gap: 4px; padding: 8px 4px; position: relative; }
  .opcoes.lado input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .opcoes.lado .tag { margin: 0; }
  .opcoes.lado .marcado { display: none; color: var(--primaria); }
  .opcoes.lado label:has(input:checked) .marcado { display: inline-flex; }
  .painel { border: 2px dashed var(--borda-campo); border-radius: 8px; padding: 12px; margin-top: 8px; }
  .dia-disp { border: 1px solid var(--borda); border-radius: 8px; padding: 12px; background: #fff; margin-bottom: 8px; }
  .dia-disp .horas { display: flex; gap: 12px; margin-top: 8px; } .dia-disp .horas > div { flex: 1; }

  /* interruptor (liga/desliga) */
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; padding: 8px 12px; background: #fff; border: 1px solid var(--borda); border-radius: 10px; font: inherit; color: var(--texto); cursor: pointer; text-align: left; margin-bottom: 8px; }
  .switch:hover { background: var(--neutro-hover); }
  .switch .estado { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: .875rem; }
  .switch .trilho { width: 44px; height: 26px; border-radius: 13px; background: #fff; border: 2px solid var(--borda-campo); position: relative; flex: none; transition: background-color var(--rapido) ease-out; }
  .switch .trilho::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--borda-campo); transition: transform var(--rapido) ease-out; }
  .switch[aria-checked="true"] .trilho { background: var(--primaria); border-color: var(--primaria); }
  .switch[aria-checked="true"] .trilho::after { background: #fff; transform: translateX(18px); }

  /* acordeão da ajuda */
  .acordeao-btn { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 56px; padding: 8px 12px; background: #fff; border: 1px solid var(--borda); border-radius: 10px; font: inherit; font-weight: 700; color: var(--texto); text-align: left; cursor: pointer; margin-top: 8px; }
  .acordeao-btn:hover { background: var(--neutro-hover); }
  .acordeao-conteudo { padding: 12px 12px 4px; }

  /* indicador de etapas (onde estou / para onde posso ir) */
  .etapas { margin-bottom: 16px; }
  .etapas ol { display: flex; gap: 4px; list-style: none; padding: 0; margin: 0 0 6px; font-size: .875rem; flex-wrap: wrap; }
  .etapas li { display: inline-flex; align-items: center; gap: 4px; color: var(--texto-secundario); }
  .etapas li + li::before { content: "›"; margin: 0 4px; color: var(--borda-campo); }
  .etapas li[aria-current="step"] { color: var(--texto); font-weight: 700; }
  .etapas a { color: var(--primaria); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; min-height: 32px; }
  .barra { height: 8px; background: var(--borda); border-radius: 4px; overflow: hidden; margin-top: 4px; } .barra div { height: 100%; background: var(--primaria); }
  .sessao { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--borda); }
  .hora { font-weight: 700; white-space: nowrap; }
  table.dados { width: 100%; border-collapse: collapse; background: #fff; } table.dados th, table.dados td { text-align: left; padding: 8px; border-bottom: 1px solid var(--borda); }
  table.dados .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* calendário */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
  .cal-nav h2 { margin: 0; font-size: 1.25rem; text-align: center; flex: 1; }
  .cal-nav .btn { min-width: 48px; padding: 0 10px; }
  table.cal { width: 100%; border-collapse: separate; border-spacing: 3px; table-layout: fixed; }
  table.cal th { font-size: .875rem; color: var(--texto-secundario); font-weight: 700; padding: 2px 0; }
  table.cal td { padding: 0; vertical-align: top; }
  .cal-dia { width: 100%; min-height: 62px; padding: 4px 2px; border: 1px solid var(--borda-campo); border-radius: 8px; background: #fff; color: var(--texto); font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: border-color var(--rapido) ease-out; }
  .cal-dia:hover { border-color: var(--primaria); border-width: 2px; }
  .cal-dia .num { font-weight: 700; font-size: 1rem; line-height: 1.2; }
  .cal-dia .marcas { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 1px 3px; font-size: .875rem; font-weight: 700; line-height: 1; }
  .cal-dia .marcas .ic { width: 14px; height: 14px; vertical-align: 0; }
  .cal-dia.hoje { border: 3px solid var(--texto); }
  .cal-dia.hoje .num { text-decoration: underline; text-underline-offset: 2px; }
  .cal-dia.sobre { background: var(--aviso-f); color: var(--aviso-t); }
  .cal-dia[aria-pressed="true"] { background: var(--primaria); color: #fff; border-color: var(--primaria-escura); }
  .legenda { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: .875rem; margin: 12px 0 0; }
  .legenda li { display: flex; align-items: center; gap: 8px; }
  .amostra { display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-width: 40px; height: 32px; padding: 0 4px; border: 1px solid var(--borda-campo); border-radius: 6px; background: #fff; font-weight: 700; flex: none; }
  .amostra .ic { width: 14px; height: 14px; vertical-align: 0; }
  .amostra.sobre { background: var(--aviso-f); color: var(--aviso-t); }
  .amostra.hoje { border: 3px solid var(--texto); text-decoration: underline; }

  /* toast e diálogo */
  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 76px; width: min(398px, calc(100vw - 32px)); background: #111827; color: #fff; padding: 8px 8px 8px 16px; border-radius: 10px; display: none; gap: 8px; align-items: center; z-index: 20; }
  #toast span { flex: 1; }
  #toast button { background: none; border: 0; color: #BFDBFE; font: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; min-height: 44px; min-width: 44px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; }
  #toast button:focus-visible { outline-color: #fff; }
  dialog { border: 0; border-radius: 12px; padding: 24px; max-width: 360px; width: calc(100vw - 32px); color: var(--texto); } dialog::backdrop { background: rgba(0,0,0,.55); }

  @media (prefers-reduced-motion: reduce) { *, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<a class="pular" href="#conteudo" onclick="event.preventDefault();document.getElementById('conteudo').focus()">Pular para o conteúdo</a>
<div id="app">
  <header id="topo"></header>
  <main id="conteudo" tabindex="-1"></main>
  <nav aria-label="Menu principal" id="menu"></nav>
</div>
<div id="toast" role="status" aria-live="polite"><span id="toast-txt"></span><button id="toast-desfazer" type="button">Desfazer</button><button id="toast-fechar" type="button" aria-label="Fechar mensagem"></button></div>
<div id="anuncio" class="sr" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlg-t" aria-describedby="dlg-p">
  <h2 id="dlg-t" style="margin-top:0"></h2>
  <p id="dlg-p"></p>
  <div id="dlg-extra"></div>
  <div class="acoes"><button class="btn perigo-forte" id="dlg-sim" type="button"></button><button class="btn neutro" id="dlg-nao" type="button">Cancelar</button></div>
</dialog>

<script>
/* =====================================================================
   Estuda+ – protótipo navegável (Trabalho III de IHC)
   Dados fictícios, sem backend. O estado fica salvo no navegador
   (localStorage) para que o usuário não perca o que fez ao recarregar.
   ===================================================================== */

/* ---------- Ícones SVG lineares (decorativos: o significado está no texto) ---------- */
const ICONES = {
  inicio: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
  atividades: '<path d="M9 6h12M9 12h12M9 18h12"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/>',
  planejamento: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  calendario: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  disciplinas: '<path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h14"/><path d="M8 7h8M8 11h6"/>',
  progresso: '<path d="M4 4v16h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',
  ajuda: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8v.5M12 17h.01"/>',
  dica: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/>',
  sugestao: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="2.5"/>',
  mais: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7"/>',
  fechar: '<path d="M6 6l12 12M18 6 6 18"/>',
  sucesso: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/>',
  erro: '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>',
  aviso: '<path d="M10.3 4.2 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4M12 17h.01"/>',
  lixeira: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  editar: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/>',
  reabrir: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  voltar: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
  esquerda: '<path d="m15 6-6 6 6 6"/>', direita: '<path d="m9 6 6 6-6 6"/>',
  cima: '<path d="m6 15 6-6 6 6"/>', baixo: '<path d="m6 9 6 6 6-6"/>',
  entrega: '<path d="M5 21V4h11l-2 4 2 4H5"/>',
  alta: '<path d="M12 4v10" stroke-width="3"/><path d="M12 19.5v.01" stroke-width="3.5"/>',
  media: '<path d="M5 9h14M5 15h14" stroke-width="2.5"/>',
  baixa: '<path d="M12 4v15M6 13l6 6 6-6" stroke-width="2.5"/>',
};
const ic = n => `<svg class="ic" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONES[n]}</svg>`;

/* ---------- Constantes ---------- */
const HOJE = new Date(2026, 11, 3), HOJE_ISO = "2026-12-03";    // data fixa: dia da apresentação (qui, 03/12/2026)
const LIMITE_DIA = 3;          // 3 ou mais entregas no mesmo dia = sobrecarga
const LIMITE_ESTUDO = 180;     // mais de 3 h de estudo no dia = sobrecarga
const LIMITE_SUGESTAO = 120;   // a sugestão automática não passa de 2 h por dia
const CHAVE = "estudamais-prototipo-v2";
const OBRIG = '<span class="obrig" aria-hidden="true">*</span>';   // campo com required: o leitor de tela anuncia "obrigatório"
const PRIO = {
  alta:  { nome: "Alta",  desc: "precisa de atenção imediata" },

const DIAS_LONGOS = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

const $ = s => document.querySelector(s);
const main = $("#conteudo");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const iso = (y, m, d) => `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
const toDate = s => { const [a, m, d] = s.split("-").map(Number); return new Date(a, m - 1, d); };
const fmt = s => { const d = toDate(s); return `${DIAS_CURTOS[d.getDay()]}, ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`; };

const dur = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? " " + (m % 60) + " min" : ""}`;

const sessoesDoDia = (p, k) => p.sessoes.filter(s => s.dia === k).sort((a, b) => min(a.ini) - min(b.ini));

/* Verificação do planejamento (HTA 4.2): conflitos bloqueiam, sobrecarga apenas avisa */
function verificar(p) {
  const conflitos = [], sobrecarga = [], provasSemEstudo = [];
  SEMANA.forEach(d => {
    const ss = sessoesDoDia(p, d.k);
    ss.forEach((s, i) => {
      const fim = min(s.ini) + s.dur;
      if (!p.disp[d.k]) conflitos.push(`${rotuloAlvo(s)} está na ${d.nome.toLowerCase()}, mas esse dia não está mais disponível.`);
      else if (min(s.ini) < min(p.disp[d.k].ini) || fim > min(p.disp[d.k].fim)) conflitos.push(`${rotuloAlvo(s)} (${d.nome.toLowerCase()}, ${s.ini}–${hhmm(fim)}) está fora do horário disponível.`);
      const prox = ss[i + 1]; if (prox && min(prox.ini) < fim) conflitos.push(`${d.nome}: ${rotuloAlvo(s)} e ${rotuloAlvo(prox)} acontecem no mesmo horário.`);
    });
    if (totalDia(p, d.k) > LIMITE_ESTUDO) sobrecarga.push(`${d.nome}: ${dur(totalDia(p, d.k))} de estudo`);
  });
  porData(pendentes()).filter(a => a.tipo === "Prova" && diasAte(a.data) >= 0 && diasAte(a.data) <= 6).forEach(a => {
    if (!p.sessoes.some(s => s.disc === a.disc && dia(s.dia).data < a.data)) provasSemEstudo.push(`${a.titulo} (${a.disc}) é ${fmt(a.data)} e ainda não tem sessão de estudo antes dessa data.`);
  });
  return { conflitos, sobrecarga, provasSemEstudo };
}

/* Acelerador: o sistema propõe sessões de 1 h nos horários livres (priorizando prazos e prioridade);
   o usuário revisa, remove ou desfaz. Não passa de 2 h por dia para não gerar sobrecarga. */
function sugerirSessoes() {
  const pend = porPrioridade(), usos = {}, novas = [];
  SEMANA.filter(d => E.rasc.disp[d.k]).forEach(d => {
    const cands = pend.filter(a => a.data > d.data);
    let total = totalDia(E.rasc, d.k);
    const ini = min(E.rasc.disp[d.k].ini), fim = min(E.rasc.disp[d.k].fim);
    for (let m = ini; m + 60 <= fim && total + 60 <= LIMITE_SUGESTAO; m += 30) {
      if (sessoesDoDia(E.rasc, d.k).some(s => m < min(s.ini) + s.dur && m + 60 > min(s.ini))) continue;
      const a = cands.filter(x => (usos[x.id] || 0) < 2).sort((x, y) => (usos[x.id] || 0) - (usos[y.id] || 0))[0];
      if (!a) break;
      const s = { id: ++E.proxId, alvo: "a:" + a.id, disc: a.disc, dia: d.k, ini: hhmm(m), dur: 60 };
      E.rasc.sessoes.push(s); novas.push(s); usos[a.id] = (usos[a.id] || 0) + 1; total += 60; m += 30;
    }
  });
  return novas;
}

/* antecipação: assim que a data é escolhida, o sistema avisa se o dia já está cheio ou se a data passou */
function avisarData() {
  const data = $("#data").value, aviso = $("#aviso-dia"), btn = $("#f-atv [type=submit]");
  aviso.innerHTML = ""; delete aviso.dataset.ok; btn.textContent = editId ? "Salvar alterações" : "Salvar atividade";
  if (!data) return;
  if (diasAte(data) < 0) { msgErro($("#e-data"), `A data ${fmt(data)} já passou. Escolha hoje (${fmt(HOJE_ISO).slice(5)}) ou uma data futura.`); $("#data").setAttribute("aria-invalid", "true"); return; }
  msgErro($("#e-data"), ""); $("#data").removeAttribute("aria-invalid");
  if (noDia(data, editId) >= LIMITE_DIA) {
    aviso.dataset.ok = data;
    aviso.innerHTML = `<div class="alerta aviso"><strong>${ic("aviso")} ${fmt(data)} já tem ${noDia(data, editId)} entregas</strong>Isso pode gerar sobrecarga. Você pode escolher outra data ou salvar mesmo assim.</div>`;
    btn.textContent = "Salvar mesmo assim";
  }
}

      <p>Organize seus estudos sem sobrecarga, em três passos:</p>
      <ol class="limpa">
        <li class="card"><h3>${ic("atividades")} 1. Cadastre suas atividades</h3><p class="peq" style="margin:4px 0 0">Provas, trabalhos e tarefas com data de entrega e prioridade.</p></li>
        <li class="card"><h3>${ic("planejamento")} 2. Monte seu planejamento semanal</h3><p class="peq" style="margin:4px 0 0">Informe quando você pode estudar e distribua as sessões. O app pode sugerir para você.</p></li>

        <a class="link-btn" href="#ajuda" data-comecar-ajuda>${ic("ajuda")} Ver a ajuda completa</a></div>`;
  },

  inicio() {
    const pend = ordenar(pendentes()), urg = pend.filter(a => diasAte(a.data) <= 3);
    const feitas = E.atividades.filter(a => a.feita).length, total = E.atividades.length || 1;
    const hoje = sessoesNaData(HOJE_ISO);
    return `<h1 tabindex="-1">Olá, Lucas</h1><p class="peq">${fmtLongo(HOJE_ISO)}</p>
      ${diasSobrecarga().map(d => `<div class="alerta aviso"><strong>${ic("aviso")} Dia com muitas atividades</strong>${fmt(d)} tem ${noDia(d)} entregas ou provas. Que tal adiantar alguma?
        <div><button type="button" class="link-btn" data-ver-dia="${d}">${ic("calendario")} Ver ${fmt(d)} no calendário</button></div></div>`).join("")}
      <div class="acoes" style="margin-top:0"><a class="btn prim" href="#nova-atividade">${ic("mais")} Nova atividade</a></div>
      <h2>Próximos 3 dias</h2>
      ${urg.length ? `<ul class="limpa">${urg.map(cartao).join("")}</ul>` : '<p class="peq">Nada com prazo próximo. Bom momento para adiantar conteúdo.</p>'}
      <h2>Estudos de hoje</h2>
      ${!E.plano ? `<div class="card"><p>Você ainda não tem um planejamento semanal de estudos.</p><a class="link-btn" href="#planejamento">${ic("planejamento")} Criar planejamento semanal</a></div>`
        : hoje.length ? `<ul class="limpa card">${hoje.map(s => linhaSessao(s)).join("")}</ul>`
        : '<p class="peq">Nenhuma sessão de estudo planejada para hoje.</p>'}
      <section class="card" aria-labelledby="t-prog" style="margin-top:24px"><h2 id="t-prog" style="margin-top:0;font-size:1.125rem">Seu progresso</h2>
        <p>${feitas} de ${E.atividades.length} atividades concluídas · ${pend.length} pendentes</p>
        <div class="barra" role="progressbar" aria-label="Atividades concluídas" aria-valuemin="0" aria-valuemax="${E.atividades.length}" aria-valuenow="${feitas}"><div style="width:${feitas / total * 100}%"></div></div>
        <a class="link-btn" href="#acompanhamento" style="margin-top:4px">${ic("progresso")} Ver acompanhamento completo</a>
      </section>`;
  },

  /* lista agrupada em blocos menores (memória de trabalho / Lei de Hick) */
  atividades() {
    const o = ordenar(E.atividades);
    const grupos = [
      ["Atrasadas", o.filter(a => !a.feita && diasAte(a.data) < 0)],
      ["Próximos 7 dias", o.filter(a => !a.feita && diasAte(a.data) >= 0 && diasAte(a.data) <= 7)],
      ["Mais tarde", o.filter(a => !a.feita && diasAte(a.data) > 7)],
      ["Concluídas", o.filter(a => a.feita)],
    ].filter(g => g[1].length);
    return `<h1 tabindex="-1">Atividades</h1>
      <div class="acoes" style="margin:8px 0 8px"><a class="btn prim" href="#nova-atividade">${ic("mais")} Nova atividade</a>
        <a class="btn sec" href="#disciplinas">${ic("disciplinas")} Gerenciar disciplinas</a></div>
      ${grupos.length ? grupos.map(([nome, l]) => `<h2>${nome} <span class="peq">(${l.length})</span></h2><ul class="limpa">${l.map(cartao).join("")}</ul>`).join("")
        : '<p class="peq">Nenhuma atividade cadastrada.</p>'}`;
  },

  /* ---------- Tarefa crítica 1: cadastrar e priorizar uma atividade (Alternativa B – tela única) ---------- */
  "nova-atividade"() {
    editId = null;
    return `<h1 tabindex="-1">Nova atividade</h1><p class="peq">Preencha as informações para cadastrar sua atividade.</p>
      ${dica("form-atv", "Se a disciplina não estiver na lista, use “Minha disciplina não está na lista”. Você não perde o que já preencheu.")}` + formAtividade(null);
  },

  "editar-atividade"() {
    const a = E.atividades.find(x => x.id === editId);
    if (!a) { setTimeout(() => ir("atividades")); return ""; }
    return `<h1 tabindex="-1">Editar atividade</h1><p class="peq">Altere o que precisar e salve.</p>` + formAtividade(a);
  },

  "atividade-salva"() {
    const a = E.atividades.find(x => x.id === ultimoCadastro);
    if (!a) { setTimeout(() => ir("atividades")); return ""; }
    return `<div class="alerta ok" role="status"><strong>${ic("sucesso")} Atividade salva</strong>Ela já aparece na sua lista de atividades e no calendário.</div>
      <h1 tabindex="-1">Atividade cadastrada</h1><p class="peq">Confira as informações:</p>
      <ul class="limpa">${cartao(a)}</ul>
      <div class="acoes"><a class="btn prim" href="#atividades">Ver lista de atividades</a><a class="btn sec" href="#nova-atividade">${ic("mais")} Cadastrar outra atividade</a>
        <a class="link-btn" href="#calendario">${ic("calendario")} Ver no calendário</a></div>`;
  },

  disciplinas() {
    return `<h1 tabindex="-1">Disciplinas</h1>
      <div id="resumo-erros"></div>
      <form id="f-disc" novalidate class="card">
        <label for="nova-disc">Nome da nova disciplina</label>
        <input type="text" id="nova-disc" aria-describedby="e-nova-disc"><p id="e-nova-disc" class="msg-erro"></p>
        <button class="btn prim bloco" type="submit" style="margin-top:12px">${ic("mais")} Adicionar disciplina</button>
      </form>
      <ul class="limpa">${E.disciplinas.map((d, i) => {
        const lista = porData(E.atividades.filter(a => a.disc === d)), n = lista.filter(a => !a.feita).length;
        if (editandoDisc === d) return `<li class="card"><form id="f-renomear" novalidate>
            <label for="ren-nome">Novo nome para ${esc(d)}</label>
            <input type="text" id="ren-nome" value="${esc(d)}" aria-describedby="e-ren-nome"><p id="e-ren-nome" class="msg-erro"></p>
            <div class="acoes-cartao"><button class="btn prim peq-btn" type="submit">Salvar alterações</button><button class="btn neutro peq-btn" type="button" data-cancelar-ren>Cancelar</button></div>
          </form></li>`;
        return `<li class="card"><h3>${esc(d)}</h3>
          <p class="peq" style="margin:0">${n ? `${n} atividade${n > 1 ? "s" : ""} pendente${n > 1 ? "s" : ""}` : "Nenhuma atividade pendente"} · ${lista.length} no total</p>
          ${botaoPainel("bd-" + i, "pd-" + i, `Ver atividades de ${esc(d)}`, false)}
          <div id="pd-${i}" role="region" aria-labelledby="bd-${i}" hidden>
            ${lista.length ? `<ul class="limpa">${lista.map(a => `<li class="sessao"><div><strong>${esc(a.titulo)}</strong><br><span class="peq">${esc(a.tipo)} · ${fmt(a.data)}</span></div>
              ${a.feita ? `<span class="tag ok">${ic("check")} Concluída</span>` : tag(a.prio)}</li>`).join("")}</ul>` : '<p class="peq">Nenhuma atividade cadastrada nesta disciplina.</p>'}
          </div>
          <div class="acoes-cartao">
            <button class="btn neutro peq-btn" type="button" data-editar-disc="${esc(d)}">${ic("editar")} Editar<span class="sr"> ${esc(d)}</span></button>
            <button class="btn perigo peq-btn separado" type="button" data-excluir-disc="${esc(d)}">${ic("lixeira")} Excluir<span class="sr"> ${esc(d)}</span></button>
          </div></li>`; }).join("")}</ul>`;
  },

  /* ---------- Tarefa crítica 2: criar um planejamento semanal de estudos ---------- */
  planejamento() {
    const rascunho = E.rasc ? `<div class="alerta info"><strong>${ic("editar")} Planejamento em edição, ainda não salvo</strong>
        Você começou a ${E.plano ? "editar" : "criar"} um planejamento e saiu antes de salvar (${E.rasc.sessoes.length} sessões). Nada foi perdido.
        <div class="acoes"><button class="btn prim" type="button" data-continuar-rasc>Continuar edição</button>
          <button class="link-btn" type="button" data-descartar-rasc>${ic("lixeira")} Descartar rascunho</button></div></div>` : "";
    if (!E.plano) return `<h1 tabindex="-1">Planejamento de Estudos</h1>${rascunho}
      ${E.rasc ? "" : `<div class="card"><p>Você ainda não tem um planejamento para esta semana.</p>
      <p class="peq">Você vai informar quando pode estudar e montar suas sessões de estudo. Leva cerca de 3 minutos.</p></div>
      <div class="acoes"><button class="btn prim" type="button" data-plano="novo">Criar planejamento semanal</button></div>`}`;
    return `<h1 tabindex="-1">Planejamento de Estudos</h1><p class="peq">Semana de ${fmt(SEMANA[0].data).slice(5)} a ${fmt(SEMANA[6].data).slice(5)}</p>${rascunho}
      ${cronograma(E.plano, false)}
      ${E.rasc ? "" : `<div class="acoes"><button class="btn prim" type="button" data-plano="editar">${ic("editar")} Editar planejamento semanal</button></div>`}`;
  },

  "plan-disp"() {
    if (!E.rasc) { setTimeout(() => ir("planejamento")); return ""; }
    return etapas(1) + `<h1 tabindex="-1">Quando você pode estudar?</h1>
      <p class="peq">Marque os dias e informe o horário em que está livre.</p>
      <div id="resumo-erros"></div>
      <form id="f-disp" novalidate>
        <fieldset id="dias" aria-describedby="e-dias"><legend>Dias disponíveis ${OBRIG}</legend>
          ${SEMANA.map(d => { const v = E.rasc.disp[d.k], ini = v ? v.ini : "19:00";
            return `<div class="dia-disp"><div class="opcoes"><label style="flex:1"><input type="checkbox" name="dia" value="${d.k}" ${v ? "checked" : ""} aria-controls="h-${d.k}" aria-expanded="${!!v}">${d.nome}</label></div>
              <div class="horas" id="h-${d.k}" ${v ? "" : "hidden"}>
                <div><label for="ini-${d.k}">Das</label><select id="ini-${d.k}" data-ini="${d.k}">${opcoesHora(360, 1380, ini)}</select></div>
                <div><label for="fim-${d.k}">Até</label><select id="fim-${d.k}" aria-describedby="e-fim-${d.k}">${opcoesHora(min(ini) + 30, 1410, v ? v.fim : "21:00")}</select></div>
              </div><p id="e-fim-${d.k}" class="msg-erro"></p></div>`; }).join("")}
          <p id="e-dias" class="msg-erro"></p></fieldset>
        <div class="acoes"><button class="btn prim" type="submit">Continuar para sessões</button><a class="btn neutro" href="#planejamento">Sair e continuar depois</a></div>
      </form>`;
  },

  "plan-sessoes"() {
    if (!E.rasc || !Object.keys(E.rasc.disp).length) { setTimeout(() => ir("plan-disp")); return ""; }
    const pend = porData(pendentes()), diasDisp = SEMANA.filter(d => E.rasc.disp[d.k]);
    return etapas(2) + `<h1 tabindex="-1">Monte suas sessões de estudo</h1>
      <p class="peq">Adicione quantas sessões quiser. As atividades pendentes estão em ordem de entrega.</p>
      ${dica("sessoes", "Toque em “Estudar para esta atividade” para preencher o formulário, ou use “Sugerir sessões para mim” e depois ajuste o que quiser.")}
      <div id="resumo-erros"></div>

      <button type="button" class="btn sec bloco" id="sugerir">${ic("sugestao")} Sugerir sessões para mim</button>
      <p class="peq" style="margin-top:4px">O app preenche seus horários livres com até 2 h por dia, começando pelas atividades mais urgentes. Você revisa tudo antes de salvar.</p>

      ${botaoPainel("btn-pend", "painel-pend", `${ic("atividades")} Atividades pendentes (${pend.length})`, true, "btn neutro bloco")}
      <div id="painel-pend" role="region" aria-labelledby="btn-pend" style="margin-top:8px">
        <ul class="limpa">${pend.map(a => `<li class="card" style="padding:12px"><h3 style="font-size:1rem">${esc(a.titulo)}</h3>
          <p class="peq" style="margin:0">${esc(a.disc)} · ${fmt(a.data)} (${quando(a.data)})</p>${tag(a.prio)}
          <div><button type="button" class="link-btn" data-estudar="${a.id}">Estudar para esta atividade<span class="sr">: ${esc(a.titulo)}</span></button></div></li>`).join("")}</ul>
      </div>

      <form id="f-sessao" novalidate class="card" style="margin-top:16px" aria-labelledby="t-nova-sessao">
        <h2 id="t-nova-sessao" style="margin-top:0">Nova sessão</h2>
        <div class="campo"><label for="s-alvo">O que estudar ${OBRIG}</label>
          <select id="s-alvo" required aria-describedby="e-s-alvo"><option value="">Selecione</option>
            <optgroup label="Atividades pendentes">${pend.map(a => `<option value="a:${a.id}">${esc(a.disc)}: ${esc(a.titulo)}</option>`).join("")}</optgroup>
            <optgroup label="Revisão geral da disciplina">${E.disciplinas.map(d => `<option value="d:${esc(d)}">${esc(d)}</option>`).join("")}</optgroup>
          </select><p id="e-s-alvo" class="msg-erro"></p></div>
        <div class="campo"><label for="s-dia">Dia</label>
          <select id="s-dia">${diasDisp.map(d => `<option value="${d.k}">${d.nome} (livre das ${E.rasc.disp[d.k].ini} às ${E.rasc.disp[d.k].fim})</option>`).join("")}</select></div>
        <div style="display:flex;gap:12px">
          <div class="campo" style="flex:1"><label for="s-ini">Início</label><select id="s-ini" aria-describedby="e-s-ini"></select></div>
          <div class="campo" style="flex:1"><label for="s-dur">Duração</label><select id="s-dur" aria-describedby="d-s-dur e-s-dur"></select></div>
        </div>
        <p id="d-s-dur" class="peq" style="margin-top:-12px">Só aparecem durações que cabem no seu horário livre.</p>
        <p id="e-s-ini" class="msg-erro"></p><p id="e-s-dur" class="msg-erro"></p>
        <button class="btn sec bloco" type="submit">${ic("mais")} Adicionar sessão ao cronograma</button>
      </form>

      <h2>Sessões adicionadas (${E.rasc.sessoes.length})</h2>
      ${E.rasc.sessoes.length ? cronograma({ ...E.rasc, disp: Object.fromEntries(Object.entries(E.rasc.disp).filter(([k]) => E.rasc.sessoes.some(s => s.dia === k))) }, true)
        : '<p class="peq">Nenhuma sessão adicionada ainda.</p>'}
      <div class="acoes"><button class="btn prim" type="button" id="ir-revisao">Revisar planejamento</button><a class="btn neutro" href="#plan-disp">Voltar para disponibilidade</a></div>`;
  },

  "plan-revisao"() {
    if (!E.rasc || !E.rasc.sessoes.length) { setTimeout(() => ir("plan-sessoes")); return ""; }
    const v = verificar(E.rasc);
    return etapas(3) + `<h1 tabindex="-1">Revise seu planejamento</h1>
      <div id="resumo-erros"></div>
      ${v.conflitos.length ? `<div class="alerta erro"><strong>${ic("erro")} ${v.conflitos.length} conflito${v.conflitos.length > 1 ? "s" : ""} de horário</strong>
          <ul>${v.conflitos.map(c => `<li>${esc(c)}</li>`).join("")}</ul>Remova ou ajuste as sessões antes de salvar.</div>`
        : `<div class="alerta ok"><strong>${ic("sucesso")} Nenhum conflito de horário</strong>Todas as sessões estão dentro dos horários disponíveis.</div>`}
      ${v.sobrecarga.length ? `<div class="alerta aviso"><strong>${ic("aviso")} Risco de sobrecarga</strong>
          <ul>${v.sobrecarga.map(c => `<li>${esc(c)}</li>`).join("")}</ul>Mais de 3 horas de estudo no dia, além das aulas, pode cansar. Considere distribuir melhor ou incluir pausas.</div>` : ""}
      ${v.provasSemEstudo.length ? `<div class="alerta aviso"><strong>${ic("aviso")} Prova sem estudo planejado</strong>
          <ul>${v.provasSemEstudo.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
      <p>${E.rasc.sessoes.length} sessões · ${dur(E.rasc.sessoes.reduce((t, s) => t + s.dur, 0))} de estudo na semana</p>
      ${cronograma(E.rasc, true)}
      <div class="acoes"><button class="btn prim" type="button" id="salvar-plano">${ic("check")} Salvar planejamento</button>
        <a class="btn neutro" href="#plan-sessoes">Ajustar sessões</a></div>`;
  },

  "plano-salvo"() {
    if (!E.plano) { setTimeout(() => ir("planejamento")); return ""; }
    return `<div class="alerta ok" role="status"><strong>${ic("sucesso")} Planejamento salvo</strong>As sessões aparecem no Início e no Calendário.</div>
      <h1 tabindex="-1">Seu planejamento da semana</h1>${cronograma(E.plano, false)}
      <div class="acoes"><a class="btn prim" href="#inicio">Ir para o Início</a><a class="btn sec" href="#calendario">${ic("calendario")} Ver no calendário</a></div>`;
  },

  /* ---------- Calendário (HU07 e HU08) ---------- */
  calendario() {
    const { y, m } = calMes;
    const offset = new Date(y, m, 1).getDay(), total = new Date(y, m + 1, 0).getDate();
    let celulas = Array(offset).fill("<td></td>");
    for (let d = 1; d <= total; d++) {
      const ds = iso(y, m, d);
      const pend = noDia(ds), ses = sessoesNaData(ds), estudo = ses.reduce((t, s) => t + s.dur, 0);
      const sobre = pend >= LIMITE_DIA || estudo > LIMITE_ESTUDO;
      const desc = [ds === HOJE_ISO ? "hoje" : "", pend ? `${pend} entrega${pend > 1 ? "s" : ""} pendente${pend > 1 ? "s" : ""}` : "",
                    ses.length ? `${ses.length} sessão${ses.length > 1 ? "ões" : ""} de estudo` : "", sobre ? "dia com sobrecarga" : ""].filter(Boolean).join(", ");
      celulas.push(`<td><button type="button" class="cal-dia ${ds === HOJE_ISO ? "hoje" : ""} ${sobre ? "sobre" : ""}" data-dia="${ds}"
        aria-pressed="${ds === calSel}" tabindex="${ds === calSel ? 0 : -1}" aria-label="${fmtLongo(ds)}${desc ? ": " + desc : ""}">
        <span class="num">${d}</span><span class="marcas" aria-hidden="true">${pend ? ic("entrega") + pend : ""}${ses.length ? ic("planejamento") : ""}${sobre ? ic("aviso") : ""}</span></button></td>`);
    }
    while (celulas.length % 7) celulas.push("<td></td>");
    const linhas = []; for (let i = 0; i < celulas.length; i += 7) linhas.push(`<tr>${celulas.slice(i, i + 7).join("")}</tr>`);
    const atvs = ordenar(E.atividades.filter(a => a.data === calSel)), ses = sessoesNaData(calSel);
    return `<h1 tabindex="-1">Calendário</h1>
      ${dica("calendario", "Toque em um dia para ver as entregas e sessões dele. Dias com fundo amarelo e ícone de aviso estão sobrecarregados.")}
      <div class="cal-nav">
        <button type="button" class="btn neutro peq-btn" data-mes="-1">${ic("esquerda")}<span class="sr">Mês anterior</span></button>
        <h2 id="t-mes" aria-live="polite">${MESES[m][0].toUpperCase() + MESES[m].slice(1)} de ${y}</h2>
        <button type="button" class="btn neutro peq-btn" data-mes="1">${ic("direita")}<span class="sr">Próximo mês</span></button>
      </div>
      <p class="sr" id="dica-cal">No teclado, use as setas para mudar de dia.</p>
      <table class="cal" aria-labelledby="t-mes" aria-describedby="dica-cal">
        <thead><tr>${["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"].map(n => `<th scope="col" abbr="${n}">${n.slice(0, 3).toLowerCase()}</th>`).join("")}</tr></thead>
        <tbody>${linhas.join("")}</tbody></table>
      <ul class="limpa legenda" aria-label="Legenda do calendário">
        <li><span class="amostra" aria-hidden="true">${ic("entrega")}2</span> Entregas pendentes</li>
        <li><span class="amostra" aria-hidden="true">${ic("planejamento")}</span> Sessão de estudo</li>
        <li><span class="amostra sobre" aria-hidden="true">${ic("aviso")}</span> Sobrecarga</li>
        <li><span class="amostra hoje" aria-hidden="true">${HOJE.getDate()}</span> Hoje</li>
      </ul>
      <section aria-labelledby="t-dia" id="detalhe-dia">
        <h2 id="t-dia">${fmtLongo(calSel)}${calSel === HOJE_ISO ? " (hoje)" : ""}</h2>
        ${noDia(calSel) >= LIMITE_DIA ? `<div class="alerta aviso"><strong>${ic("aviso")} Dia com muitas atividades</strong>${noDia(calSel)} entregas ou provas neste dia. Considere adiantar alguma.</div>` : ""}
        ${atvs.length ? `<h3 style="margin-bottom:8px">Entregas e provas</h3><ul class="limpa">${atvs.map(cartao).join("")}</ul>` : ""}
        ${ses.length ? `<h3 style="margin:8px 0">Sessões de estudo</h3><ul class="limpa card">${ses.map(s => linhaSessao(s)).join("")}</ul>` : ""}
        ${!atvs.length && !ses.length ? `<p class="peq">Nada marcado para este dia.</p>` : ""}
        <div class="acoes" style="margin-top:8px"><a class="btn sec" href="#nova-atividade">${ic("mais")} Nova atividade</a></div>
      </section>`;
  },

  /* ---------- Acompanhamento (HU10) ---------- */
  acompanhamento() {
    const feitas = E.atividades.filter(a => a.feita).length, total = E.atividades.length || 1;
    const sobreEnt = diasSobrecarga(), sobreEst = E.plano ? SEMANA.filter(d => totalDia(E.plano, d.k) > LIMITE_ESTUDO) : [];
    const horas = E.plano ? E.disciplinas.map(d => [d, E.plano.sessoes.filter(s => s.disc === d).reduce((t, s) => t + s.dur, 0)]).filter(x => x[1]) : [];
    return `<h1 tabindex="-1">Acompanhamento</h1>
      <section class="card" aria-labelledby="t-geral"><h2 id="t-geral" style="margin-top:0;font-size:1.125rem">Progresso geral</h2>
        <p>${feitas} de ${E.atividades.length} atividades concluídas (${Math.round(feitas / total * 100)}%)</p>
        <div class="barra" role="progressbar" aria-label="Atividades concluídas" aria-valuemin="0" aria-valuemax="${E.atividades.length}" aria-valuenow="${feitas}"><div style="width:${feitas / total * 100}%"></div></div></section>
      <h2>Por disciplina</h2>
      <table class="dados"><caption class="sr">Atividades concluídas e pendentes por disciplina</caption>
        <thead><tr><th scope="col">Disciplina</th><th scope="col" class="num">Concluídas</th><th scope="col" class="num">Pendentes</th></tr></thead>
        <tbody>${E.disciplinas.map(d => { const l = E.atividades.filter(a => a.disc === d);
          return `<tr><th scope="row">${esc(d)}</th><td class="num">${l.filter(a => a.feita).length}</td><td class="num">${l.filter(a => !a.feita).length}</td></tr>`; }).join("")}</tbody></table>

/* ================= Eventos ================= */
/* restrição: só aparecem inícios e durações possíveis dentro do horário livre */
function atualizarInicios() {
  const d = $("#s-dia")?.value; if (!d) return;
  const r = E.rasc.disp[d], atual = $("#s-ini").value;
  const valido = atual && min(atual) >= min(r.ini) && min(atual) <= min(r.fim) - 30;
  $("#s-ini").innerHTML = opcoesHora(min(r.ini), min(r.fim) - 30, valido ? atual : r.ini);
  atualizarDuracoes();
}
function atualizarDuracoes() {
  if (!$("#s-ini").value) $("#s-ini").selectedIndex = 0;
  const d = $("#s-dia").value, fim = min(E.rasc.disp[d].fim), ini = min($("#s-ini").value), atual = Number($("#s-dur").value) || 60;
  const ok = [30, 60, 90, 120].filter(m => ini + m <= fim), sel = ok.includes(atual) ? atual : (ok.filter(m => m <= 60).pop() || ok[0]);
  $("#s-dur").innerHTML = ok.map(m => `<option value="${m}" ${m === sel ? "selected" : ""}>${dur(m)}</option>`).join("");
}
function validarNomeDisc(nome, atual) {
  if (!nome) return "Digite o nome da disciplina.";
  if (E.disciplinas.some(d => d.toLowerCase() === nome.toLowerCase() && d !== atual)) return `${nome} já está na sua lista.`;
  return "";
}
const progressoTxt = () => `Você já concluiu ${E.atividades.filter(a => a.feita).length} de ${E.atividades.length} atividades.`;

main.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target;

  if (f.id === "f-atv") {
    const titulo = $("#titulo").value.trim(), disc = $("#disc").value, data = $("#data").value;
    const erros = [];
    if (!titulo) erros.push({ campo: "titulo", msg: "Informe o título.", rotulo: "Título: informe o título" });
    if (!disc) erros.push({ campo: "disc", msg: "Escolha a disciplina.", rotulo: "Disciplina: escolha uma opção" });
    if (!data) erros.push({ campo: "data", msg: "Informe a data de entrega.", rotulo: "Data de entrega: informe a data" });
    else if (diasAte(data) < 0) erros.push({ campo: "data", msg: `A data ${fmt(data)} já passou. Escolha hoje (${fmt(HOJE_ISO).slice(5)}) ou uma data futura.`, rotulo: "Data de entrega: a data já passou" });
    if (!mostrarErros(erros)) return;
    const aviso = $("#aviso-dia");
    if (noDia(data, editId) >= LIMITE_DIA && aviso.dataset.ok !== data) { avisarData(); aviso.querySelector(".alerta")?.setAttribute("tabindex", "-1"); aviso.querySelector(".alerta")?.focus(); return; }
    const dados = { titulo, disc, data, tipo: f.tipo.value, prio: f.prio.value };
    if (editId) {
      Object.assign(E.atividades.find(a => a.id === editId), dados);
      toast(`Alterações em “${titulo}” salvas.`); editId = null; ir("atividades");
    } else {
      ultimoCadastro = ++E.proxId;
      E.atividades.push({ id: ultimoCadastro, ...dados, feita: false });
      ir("atividade-salva");
    }
  }

  if (f.id === "f-disc") {
    const nome = $("#nova-disc").value.trim(), erro = validarNomeDisc(nome);
    if (!mostrarErros(erro ? [{ campo: "nova-disc", msg: erro }] : [])) return;
    E.disciplinas.push(nome); ordenarDisc(); render(false); toast(`Disciplina ${nome} adicionada.`); $("#nova-disc").focus();
  }

  if (f.id === "f-renomear") {
    const antigo = editandoDisc, nome = $("#ren-nome").value.trim(), erro = validarNomeDisc(nome, antigo);
    if (!mostrarErros(erro ? [{ campo: "ren-nome", msg: erro }] : [])) return;
    E.disciplinas[E.disciplinas.indexOf(antigo)] = nome;
    E.atividades.forEach(a => { if (a.disc === antigo) a.disc = nome; });
    [E.plano, E.rasc].forEach(p => p && p.sessoes.forEach(s => { if (s.disc === antigo) { s.disc = nome; if (s.alvo === "d:" + antigo) s.alvo = "d:" + nome; } }));
    editandoDisc = null; render(false); toast(`Disciplina renomeada para ${nome}.`);
    $(`[data-editar-disc="${CSS.escape(nome)}"]`).focus();
  }

  if (f.id === "f-disp") {
    const marcados = [...f.querySelectorAll("[name=dia]:checked")].map(i => i.value);
    const erros = [];
    if (!marcados.length) erros.push({ campo: "dias", msg: "Marque pelo menos um dia em que você pode estudar.", rotulo: "Dias disponíveis: marque pelo menos um" });
    marcados.forEach(k => { if (min($("#fim-" + k).value) <= min($("#ini-" + k).value))
      erros.push({ campo: "fim-" + k, msg: `O horário final precisa ser depois do inicial (${$("#ini-" + k).value}).`, rotulo: `${dia(k).nome}: horário final antes do inicial` }); });
    if (!mostrarErros(erros)) return;
    E.rasc.disp = Object.fromEntries(marcados.map(k => [k, { ini: $("#ini-" + k).value, fim: $("#fim-" + k).value }]));
    ir("plan-sessoes");
  }

  if (f.id === "f-sessao") {
    const alvo = $("#s-alvo").value, d = $("#s-dia").value, ini = $("#s-ini").value, m = Number($("#s-dur").value);
    const erros = [];
    if (!alvo) erros.push({ campo: "s-alvo", msg: "Escolha uma atividade ou disciplina para estudar.", rotulo: "O que estudar: escolha uma opção" });
    else {
      const fim = min(ini) + m, disp = E.rasc.disp[d];
      const choque = sessoesDoDia(E.rasc, d).find(s => min(ini) < min(s.ini) + s.dur && fim > min(s.ini));
      if (fim > min(disp.fim)) erros.push({ campo: "s-dur", msg: `A sessão terminaria às ${hhmm(fim)}, mas você está livre só até ${disp.fim}. Escolha uma duração menor.`, rotulo: "Duração: passa do horário disponível" });
      else if (choque) erros.push({ campo: "s-ini", msg: `Conflito de horário: ${rotuloAlvo(choque)} já está das ${choque.ini} às ${hhmm(min(choque.ini) + choque.dur)}. Escolha outro início.`, rotulo: "Início: conflito com outra sessão" });
    }
    if (!mostrarErros(erros)) return;
    const disc = alvo.startsWith("a:") ? E.atividades.find(a => a.id == alvo.slice(2)).disc : alvo.slice(2);
    const s = { id: ++E.proxId, alvo, disc, dia: d, ini, dur: m };
    E.rasc.sessoes.push(s);
    render(false);
    toast(`Sessão adicionada: ${rotuloAlvo(s)}, ${dia(d).nome.toLowerCase()} das ${ini} às ${hhmm(min(ini) + m)}.`);
    $("#s-dia").value = d; atualizarInicios(); $("#s-alvo").focus();   // pronto para a próxima (HTA plano 3)
  }
});

main.addEventListener("click", ev => {
  const b = ev.target.closest("button, a"); if (!b) return;
  if (b.dataset.focar) focar(b.dataset.focar);

  /* painéis recolhíveis: aria-expanded + aria-controls */
  if (b.hasAttribute("data-toggle")) {
    const aberto = b.getAttribute("aria-expanded") === "true", painel = $("#" + b.getAttribute("aria-controls"));
    b.setAttribute("aria-expanded", String(!aberto)); painel.hidden = aberto;
    b.querySelector(".chev").innerHTML = ic(aberto ? "baixo" : "cima");
    if (!aberto) painel.querySelector("input")?.focus();
  }

  /* boas-vindas, dicas e preferências */
  if (b.hasAttribute("data-comecar")) { E.boasVindasVistas = true; ir("inicio"); }
  if (b.hasAttribute("data-comecar-ajuda")) E.boasVindasVistas = true;
  if (b.dataset.fecharDica) { E.dicasFechadas.push(b.dataset.fecharDica); render(false); main.querySelector("h1").focus(); anunciar("Dica escondida. Você pode reativar as dicas em Ajuda."); }
  if (b.dataset.pref) {
    E.prefs[b.dataset.pref] = !E.prefs[b.dataset.pref];
    if (b.dataset.pref === "dicas" && E.prefs.dicas) E.dicasFechadas = [];
    render(false); $(`[data-pref="${b.dataset.pref}"]`).focus();
  }
  if (b.hasAttribute("data-rever-boas-vindas")) ir("boas-vindas");
  if (b.hasAttribute("data-restaurar")) confirmar({ titulo: "Restaurar dados de exemplo?", icone: "reabrir", botao: "Restaurar dados de exemplo",
    texto: "Tudo o que você cadastrou, editou ou planejou será apagado e os dados de exemplo voltarão. Essa ação não pode ser desfeita.",
    acao: () => { try { localStorage.removeItem(CHAVE); } catch (e) { } location.hash = ""; location.reload(); } });

  /* atividades */
  if (b.dataset.concluir) {
    const a = E.atividades.find(x => x.id == b.dataset.concluir); a.feita = true; render(false);
    toast(`Boa! “${a.titulo}” concluída. ${progressoTxt()}`, () => { a.feita = false; render(false); });
  }
  if (b.dataset.reabrir) {
    const a = E.atividades.find(x => x.id == b.dataset.reabrir); a.feita = false; render(false);
    toast(`“${a.titulo}” voltou para as pendentes.`, () => { a.feita = true; render(false); });
  }
  if (b.dataset.editar) { editId = Number(b.dataset.editar); ir("editar-atividade"); }
  if (b.dataset.excluir) {
    const a = E.atividades.find(x => x.id == b.dataset.excluir);
    confirmar({ titulo: "Excluir atividade?", texto: `“${a.titulo}” será removida da sua lista. Você poderá desfazer logo em seguida.`, botao: "Excluir atividade",
      acao: () => { const pos = E.atividades.indexOf(a); E.atividades.splice(pos, 1); render(false);
        toast(`Atividade “${a.titulo}” excluída.`, () => { E.atividades.splice(pos, 0, a); render(false); }); } });
  }
  if (b.id === "nd-add") {     // HTA 1, plano 2: cadastrar a disciplina sem sair do formulário
    const nome = $("#nd-nome").value.trim(), erro = validarNomeDisc(nome);
    msgErro($("#e-nd-nome"), erro ? (erro.includes("já está") ? `${nome} já está na lista. Selecione-a acima.` : erro) : "");
    if (erro) { $("#nd-nome").setAttribute("aria-invalid", "true"); $("#nd-nome").focus(); return; }
    $("#nd-nome").removeAttribute("aria-invalid");
    E.disciplinas.push(nome); ordenarDisc(); salvar();
    $("#disc").innerHTML = opcoesDisc(nome);
    $("#nd-nome").value = ""; $("#painel-disc").hidden = true;
    const bt = $("#btn-nova-disc"); bt.setAttribute("aria-expanded", "false"); bt.querySelector(".chev").innerHTML = ic("baixo");
    $("#disc").focus();
    toast(`Disciplina ${nome} adicionada e selecionada.`);
  }

  /* disciplinas */
  if (b.dataset.editarDisc) { editandoDisc = b.dataset.editarDisc; render(false); $("#ren-nome").focus(); $("#ren-nome").select(); }
  if (b.hasAttribute("data-cancelar-ren")) { const d = editandoDisc; editandoDisc = null; render(false); $(`[data-editar-disc="${CSS.escape(d)}"]`).focus(); }
  if (b.dataset.excluirDisc) {
    const d = b.dataset.excluirDisc, n = E.atividades.filter(a => a.disc === d).length;
    confirmar({ titulo: `Excluir ${d}?`, botao: "Excluir disciplina",
      texto: n > 1 ? `As ${n} atividades de ${d} também serão excluídas. Você poderá desfazer logo em seguida.`
           : n === 1 ? `A atividade de ${d} também será excluída. Você poderá desfazer logo em seguida.` : `${d} será removida da sua lista.`,
      confirmacao: n ? `Entendo que ${n > 1 ? `as ${n} atividades` : "a atividade"} de ${d} ${n > 1 ? "serão excluídas" : "será excluída"}` : null,
      acao: () => {
        const antes = { disciplinas: [...E.disciplinas], atividades: clone(E.atividades), plano: clone(E.plano) };
        E.disciplinas = E.disciplinas.filter(x => x !== d); E.atividades = E.atividades.filter(a => a.disc !== d);
        if (E.plano) E.plano.sessoes = E.plano.sessoes.filter(s => s.disc !== d);
        render(false);
        toast(`Disciplina ${d} excluída.`, () => { E.disciplinas = antes.disciplinas; E.atividades = antes.atividades; E.plano = antes.plano; render(false); });
        main.querySelector("h1").focus();
      } });
  }

  /* planejamento */
  if (b.dataset.estudar) { $("#s-alvo").value = "a:" + b.dataset.estudar; $("#s-dia").focus(); anunciar("Atividade selecionada no formulário Nova sessão. Agora escolha o dia."); }
  if (b.dataset.plano) { E.rasc = b.dataset.plano === "editar" ? clone(E.plano) : { disp: {}, sessoes: [] }; ir("plan-disp"); }
  if (b.hasAttribute("data-continuar-rasc")) ir(Object.keys(E.rasc.disp).length ? (E.rasc.sessoes.length ? "plan-revisao" : "plan-sessoes") : "plan-disp");
  if (b.hasAttribute("data-descartar-rasc")) {
    const r = E.rasc; E.rasc = null; render(false); main.querySelector("h1").focus();
    toast("Rascunho do planejamento descartado.", () => { E.rasc = r; render(false); });
  }
  if (b.id === "sugerir") {
    const novas = sugerirSessoes();
    if (!novas.length) { alertaFocado("aviso", "Nenhuma sugestão possível", "Seus horários livres já estão ocupados ou não há atividades com prazo depois desses dias."); return; }
    render(false); $("#sugerir").focus();
    toast(`${novas.length} sessões sugeridas. Revise e remova o que não quiser.`, () => { E.rasc.sessoes = E.rasc.sessoes.filter(s => !novas.includes(s)); render(false); });
  }
  if (b.dataset.removerSessao) {
    const i = E.rasc.sessoes.findIndex(s => s.id == b.dataset.removerSessao), s = E.rasc.sessoes[i];
    E.rasc.sessoes.splice(i, 1); render(false);
    toast(`Sessão removida: ${rotuloAlvo(s)}.`, () => { E.rasc.sessoes.splice(i, 0, s); render(false); });
    main.querySelector("h1").focus();
  }
  if (b.id === "ir-revisao") {
    if (!E.rasc.sessoes.length) return alertaFocado("erro", "Nenhuma sessão adicionada", "Adicione pelo menos uma sessão de estudo, ou toque em “Sugerir sessões para mim”.");
    ir("plan-revisao");
  }
  if (b.id === "salvar-plano") {
    if (verificar(E.rasc).conflitos.length) return alertaFocado("erro", "Não foi possível salvar", "Resolva os conflitos de horário indicados abaixo e tente novamente.");
    E.plano = clone(E.rasc); E.rasc = null; ir("plano-salvo");
  }

  /* calendário */
  if (b.dataset.verDia) { calSel = b.dataset.verDia; const d = toDate(calSel); calMes = { y: d.getFullYear(), m: d.getMonth() }; ir("calendario"); }
  if (b.dataset.dia) selecionarDia(b.dataset.dia);
  if (b.dataset.mes) {
    const d = new Date(calMes.y, calMes.m + Number(b.dataset.mes), 1);
    calMes = { y: d.getFullYear(), m: d.getMonth() }; calSel = iso(calMes.y, calMes.m, 1);
    render(false); $(`[data-mes="${b.dataset.mes}"]`).focus();
  }
});

function selecionarDia(ds) {
  const d = toDate(ds);
  calSel = ds; calMes = { y: d.getFullYear(), m: d.getMonth() };
  render(false); $(`[data-dia="${ds}"]`).focus();
}
/* setas do teclado no calendário (foco itinerante) */
main.addEventListener("keydown", ev => {
  const b = ev.target.closest(".cal-dia"); if (!b) return;
  const passo = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[ev.key]; if (!passo) return;
  ev.preventDefault();

main.addEventListener("change", ev => {

function render(navegou) {

  ordenarDisc();
  document.documentElement.classList.toggle("texto-grande", !!E.prefs.textoGrande);
  main.innerHTML = telas[nome]();
  const v = VOLTAR[nome], ajuda = nome === "ajuda" || nome === "boas-vindas" ? "" : `<a class="acao-topo dir" href="#ajuda">${ic("ajuda")} Ajuda</a>`;
  $("#topo").innerHTML = (v ? (v[0] === "historico"
      ? `<button type="button" class="acao-topo" data-voltar-hist>${ic("voltar")} Voltar<span class="sr"> para a ${v[1]}</span></button>`
      : `<a class="acao-topo" href="${v[0]}">${ic("voltar")} Voltar<span class="sr"> para ${v[1]}</span></a>`) : "")
    + `<span class="marca">Estuda+</span>` + ajuda;
  $("#menu").hidden = nome === "boas-vindas";
  const s = SECAO[nome] || nome;
  document.querySelectorAll("#menu a").forEach(a => a.dataset.sec === s ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const h1 = main.querySelector("h1");
  if (h1) document.title = h1.textContent + " – Estuda+";
  if (nome === "plan-sessoes") atualizarInicios();
  if (navegou) {   // transição curta (150 ms) só ao trocar de tela
    main.classList.remove("anim"); void main.offsetWidth; main.classList.add("anim");
    window.scrollTo(0, 0); if (h1) h1.focus();
  }
  salvar();
}
window.addEventListener("hashchange", () => render(true));
if (!E.boasVindasVistas && (!location.hash || location.hash === "#inicio")) history.replaceState(null, "", "#boas-vindas");
render(false);
</script>
</body>
</html>
